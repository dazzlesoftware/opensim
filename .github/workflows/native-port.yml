jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          # Runtime 8.0.31 is the pinned compatibility oracle, never a production dependency.
          dotnet-version: '8.0.425'
      - name: Configure C++ and reference comparison
        if: runner.os != 'macOS'
        run: cmake -S native-port -B native-port/build -DCMAKE_BUILD_TYPE=Release -DOPENSIM_DIFFERENTIAL_TESTS=ON
      - name: Configure macOS with both OfflineIM SQL providers
        if: runner.os == 'macOS'
        run: |
          brew install libpq mariadb-connector-c
          cmake -S native-port -B native-port/build -DCMAKE_BUILD_TYPE=Release -DOPENSIM_DIFFERENTIAL_TESTS=ON \
            -DOPENSIM_REQUIRE_OFFLINE_IM_SQL=ON \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix libpq);$(brew --prefix mariadb-connector-c)"
      - name: Build C++
        run: cmake --build native-port/build --config Release --parallel
      - name: Test native behavior and compare original C#
        run: ctest --test-dir native-port/build -C Release -j2 --output-on-failure --output-junit ctest-results.xml
      - name: Retain native compatibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-compatibility-${{ matrix.os }}
          path: |
            native-port/build/ctest-results.xml
            native-port/build/Testing/Temporary/LastTest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-parity-${{ matrix.os }}
          path: |
            native-port/build/reference/parity-results.json
            native-port/build/login-reference/login-parity-results.json
