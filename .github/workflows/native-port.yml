  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update && sudo apt-get install -y libjpeg-dev libpng-dev libicu-dev libfreetype-dev fonts-liberation
      - run: cmake -S native-port -B native-port/build -DCMAKE_BUILD_TYPE=Debug -DOPENSIM_SANITIZERS=ON -DOPENSIM_DIFFERENTIAL_TESTS=ON -DOPENSIM_REQUIRE_TLS=ON
      - run: cmake --build native-port/build --parallel
      - run: ctest --test-dir native-port/build --output-on-failure

  windows-https:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Configure TLS and gzip through pinned vcpkg manifest
        shell: pwsh
        run: cmake -S native-port -B native-port/build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DOPENSIM_REQUIRE_TLS=ON -DOPENSIM_DIFFERENTIAL_TESTS=ON -DVCPKG_MANIFEST_FEATURES=offline-im-sql -DOPENSIM_REQUIRE_OFFLINE_IM_SQL=ON
      - run: cmake --build native-port/build --config Release --parallel
      - run: ctest --test-dir native-port/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-https
          path: |
            native-port/build/network-tests/network-results.json
            native-port/build/Testing/Temporary/LastTest.log
